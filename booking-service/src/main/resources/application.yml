server:
  port: 8083
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: booking-service
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  datasource:
    url: ${JDBC_URL:jdbc:mysql://127.0.0.1:3308/booking?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
  graphql:
    graphiql:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.0
  otlp:
    metrics:
      export:
        enabled: false
logging:
  structured:
    format:
      console: ecs

park:
  time-zone: ${PARK_TIME_ZONE:America/New_York}
  pricing-url: ${PRICING_URL:http://127.0.0.1:8082}
